snapshots:
  - name: dim_customers
    relation: ref('eph_customers') # source('my_source', 'my_table') or ref('my_model')
    
    config:
      database: walmart
      schema: gold
      strategy: timestamp
      unique_key: customer_id
      updated_at: customer_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"