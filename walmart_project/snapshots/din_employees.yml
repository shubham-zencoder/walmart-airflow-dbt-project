snapshots:
  - name: dim_employees
    relation: ref('eph_employees') # source('my_source', 'my_table') or ref('my_model')
    
    config:
      database: walmart
      schema: gold
      strategy: timestamp
      unique_key: employee_id
      updated_at: employee_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"