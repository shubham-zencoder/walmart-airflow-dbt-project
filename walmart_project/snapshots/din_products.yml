snapshots:
  - name: dim_products
    relation: ref('eph_products') # source('my_source', 'my_table') or ref('my_model')
    
    config:
      database: walmart
      schema: gold
      strategy: timestamp
      unique_key: product_id
      updated_at: product_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"